workflows:
  ios-sideloadly:
    name: iOS Unsigned IPA for Sideloadly
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Obtener dependencias
        script: flutter pub get
      - name: Analizar código
        script: dart analyze
      - name: Ejecutar pruebas
        script: flutter test
      - name: Instalar pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firma
        script: |
          mkdir -p build/ios/sideloadly/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/sideloadly/Payload/
          cd build/ios/sideloadly
          zip -qr Bantu-unsigned.ipa Payload
    artifacts:
      - build/ios/sideloadly/*.ipa
      - /tmp/xcodebuild_logs/*.log
